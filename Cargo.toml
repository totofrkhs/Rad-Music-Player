[package]
name = "rad-music-player"
version = "0.1.0"
edition = "2021"

[dependencies]
slint = { version = "1.8", features = ["backend-winit"] }
rodio = "0.19"
symphonia = "0.6"
tokio = { version = "1", features = ["full"] }
id3 = "0.6"
rusqlite = { version = "0.31", features = ["bundled"] }

[build-dependencies]
slint-build = { version = "1.8", features = ["compat-1-18"] }
